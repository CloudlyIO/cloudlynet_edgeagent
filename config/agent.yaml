command_verify_delay: 500ms
# 15s, matching deploy/agent.yaml and the code default. The rest of this file is deliberately
# accelerated for CI, but a 3s verify budget was sized for ONE device: with a fleet behind one
# agent the SPV reaches the device and its answer misses the window, so an applied write is
# reported as "device session timeout" and rolled back (~40% of applies with 14 devices).
command_verify_timeout: 15s
