# Rule-file schema version. v2: `module:` matches each line's inline "[MODULE]"
# tag (v1 matched the archive entry filename — v1 files can never fire under
# this engine, so the agent refuses them and runs its built-in defaults).
version: 2
rules:
  # Real ACS-failure lines live in TR69 (not FM); the vendor IP no longer
  # gates the match — IP-agnostic on module+text (keep in lockstep with
  # rules.DefaultEngine()).
  - module: TR69
    match: "ACS (Connect Status = 2|connect failed|Disconnect with error)"
    event_type: vendor_acs_unreachable
    severity: major
    message: "Vendor ACS unreachable"
  - module: TR69
    match: "RPC Unknown received from ACS"
    event_type: atc_fault_loop
    severity: major
    message: "ACS returned Fault to ATC"
  - module: FILE_TRANS
    match: "File upload success, curl code=\\(0\\)"
    event_type: ftp_upload_ok
    severity: info
    message: "FTP upload succeeded"
  - module: FILE_TRANS
    match: "curl code=\\(7\\)"
    event_type: ftp_conn_fail
    severity: major
    message: "FTP connection failed"
  - module: FILE_TRANS
    match: "curl code=\\(25\\)"
    event_type: ftp_upload_path_reject
    severity: minor
    message: "FTP upload path rejected"
  - module: FILE_TRANS
    match: "curl code=\\(28\\)"
    event_type: ftp_upload_timeout
    severity: major
    message: "FTP upload timed out"
  - module: FILE_TRANS
    match: "curl code=\\(67\\)"
    event_type: ftp_auth_fail
    severity: major
    message: "FTP authentication failed"
  - module: FM
    match: "(?i)reboot|restart"
    event_type: device_reboot
    severity: critical
    message: "Device reboot detected"
