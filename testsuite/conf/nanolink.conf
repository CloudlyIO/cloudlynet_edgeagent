# NanoLink emulator config (ticket #346).
#
# Optional: every field has a hardcoded default (see config.go). FTP creds and
# the scenario can also be set via env (FTP_HOST/FTP_USER/FTP_PASS/
# NANOLINK_SCENARIO — already wired in docker-compose.test.yml), which take
# precedence over this file.

identity:
  # Synthetic serial: cwmp_id is UNIQUE per tenant on the real cloud, so a real
  # device's serial collides in acsftp. Per-tester override: NANOLINK_SERIAL env.
  oui: "8C1F64"
  product_class: "ENB-N03002-B3"
  serial: "2205609999"

ftp:
  host: "ftp"
  user: "nybsys"
  pass: ""            # set via FTP_PASS env / .env.example — never commit a real password
  upload_interval: 60s

# One of: happy | ftp-path-reject | ftp-auth-fail | ftp-conn-fail |
# ftp-timeout | atc-fault | reboot. See testsuite/README.md for what each
# stages and how self-triggering vs. operator-driven scenarios differ.
scenario: "happy"
